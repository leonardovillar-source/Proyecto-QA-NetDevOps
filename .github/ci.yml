name: Pipeline QA & NetDevOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Levantar la aplicación con Docker Compose
        run: docker compose up -d --build

      - name: Instalar dependencias de pruebas E2E
        run: |
          cd tests-e2e
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Ejecutar Pruebas E2E (Playwright)
        run: |
          cd tests-e2e
          npx playwright test

      - name: Ejecutar Pruebas de Carga (k6)
        run: |
          docker run --rm -i grafana/k6 run - < tests-performance/load-test.js
