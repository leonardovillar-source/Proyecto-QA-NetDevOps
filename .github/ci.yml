name: Pipeline QA & NetDevOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          check-latest: true

      - name: Verificar versión de Node.js
        run: node -v

      - name: Verificar versión de Node
        run: node -v

      - name: Levantar la aplicación con Docker Compose
        run: docker compose up -d --build

      - name: Instalar dependencias de pruebas E2E
        working-directory: ./tests-e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Ejecutar Pruebas E2E (Playwright)
        working-directory: ./tests-e2e
        run: npx playwright test

      - name: Ejecutar Pruebas de Carga (k6)
        run: |
          docker run --rm -i grafana/k6 run - < tests-performance/load-test.js
          # Disparar pipeline limpio